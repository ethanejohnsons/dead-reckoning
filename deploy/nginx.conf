# Serves the built game (see ../Dockerfile). Nothing here is specific to a host name: put TLS in front of it
# with whatever reverse proxy the server already runs.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The scripts, shaders and airfield data compress to a fraction of their size.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/octet-stream;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Built scripts and styles carry a hash of their contents in their names: they never change.
  location ~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Sounds, airfields, wall materials and star data change only with a new build.
  location ~ /(audio|airfields|data|facades)/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # The page itself is always fetched fresh, so a new build is picked up at once.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
